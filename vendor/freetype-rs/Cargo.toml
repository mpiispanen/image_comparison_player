[package]
name = "freetype-rs"
version = "0.26.0"
authors = ["Coeuvre <coeuvre@gmail.com>"]
description = "Bindings for FreeType font library (patched: null-safe Bitmap::buffer)"
homepage = "https://github.com/PistonDevelopers/freetype-rs"
readme = "README.md"
keywords = ["freetype", "font", "glyph"]
license = "MIT"
repository = "https://github.com/PistonDevelopers/freetype-rs.git"

[lib]
name = "freetype"

[dependencies]
bitflags = "1.0.0"
freetype-sys = "0.13.0"
libc = "0.2.1"
